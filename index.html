<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Torneos de Clash Royale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--fondo:#151A3D;--panel:#1F2760;--linea:#34409A;--texto:#F4F1FF;--suave:#A9B0E6;--oro:#F7B733;--azul:#3D7BFF;--error:#FF9A9A;--ok:#6EE7A8;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--texto);font:16px/1.5 "Nunito",system-ui,sans-serif;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
main{max-width:480px;margin:0 auto;padding:28px 0 56px}
h1,h2,.copas{font-family:"Lilita One","Nunito",system-ui,sans-serif;font-weight:400;letter-spacing:.01em}
h1{font-size:2rem;line-height:1.15;margin:0 0 6px}
h2{font-size:1.25rem;margin:0 0 12px}
.suave{color:var(--suave);margin:0 0 20px}
.oculto{display:none!important}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.tab{padding:10px;border:2px solid var(--linea);border-radius:10px;background:transparent;color:var(--suave);font:inherit;font-weight:700;cursor:pointer}
.tab.activa{background:var(--panel);color:var(--texto);border-color:var(--oro)}
label{display:block;margin-bottom:14px;font-weight:700}
input{display:block;width:100%;margin-top:6px;padding:12px;border:2px solid var(--linea);border-radius:10px;background:var(--fondo);color:var(--texto);font:inherit}
button{font:inherit}
.primario,.secundario{padding:12px 18px;border-radius:10px;font-weight:700;cursor:pointer;border:0}
.primario{width:100%;background:var(--oro);color:#2A1D00}
.secundario{background:var(--panel);color:var(--texto);border:2px solid var(--linea)}
button:disabled{opacity:.6;cursor:wait}
:focus-visible{outline:3px solid var(--oro);outline-offset:2px}
.msg{min-height:1.5em;margin:0 0 12px;color:var(--error)}
.msg.ok{color:var(--ok)}
.barra{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}
.panel{background:var(--panel);border:2px solid var(--linea);border-radius:14px;padding:18px;margin-bottom:16px}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0}
dt{color:var(--suave)}
dd{margin:0;text-align:right;overflow-wrap:anywhere}
.copas{font-size:3rem;line-height:1;color:var(--oro);margin:0}
.etiqueta{color:var(--suave);margin:2px 0 16px}
</style>
</head>
<body>
<main>

  <section id="vista-auth">
    <h1>Torneos de Clash Royale</h1>
    <p class="suave">Crea tu cuenta, vincula tu tag de Supercell y compite.</p>
    <div class="tabs">
      <button type="button" id="tab-crear" class="tab activa">Crear cuenta</button>
      <button type="button" id="tab-entrar" class="tab">Entrar</button>
    </div>
    <form id="form-auth" novalidate>
      <label class="solo-crear">Nombre<input id="nombre" autocomplete="name"></label>
      <label>Correo<input id="correo" type="email" autocomplete="email"></label>
      <label class="solo-crear">Teléfono<input id="telefono" type="tel" autocomplete="tel" placeholder="3001234567"></label>
      <label>Contraseña<input id="clave" type="password" autocomplete="new-password"></label>
      <p id="msg-auth" class="msg" role="status"></p>
      <button class="primario" id="btn-auth">Crear cuenta</button>
    </form>
  </section>

  <section id="vista-perfil" class="oculto">
    <header class="barra">
      <h1 id="p-nombre">Mi perfil</h1>
      <button type="button" id="btn-salir" class="secundario">Salir</button>
    </header>

    <div class="panel">
      <h2>Mis datos</h2>
      <dl>
        <dt>Correo</dt><dd id="p-correo"></dd>
        <dt>Teléfono</dt><dd id="p-telefono"></dd>
      </dl>
    </div>

    <div class="panel">
      <h2>Clash Royale</h2>
      <div id="clash-vinculado" class="oculto">
        <p class="copas" id="c-copas">–</p>
        <p class="etiqueta">copas</p>
        <dl>
          <dt>Jugador</dt><dd id="c-nombre">–</dd>
          <dt>Mejor marca</dt><dd id="c-mejor">–</dd>
          <dt>Nivel</dt><dd id="c-nivel">–</dd>
          <dt>Victorias / derrotas</dt><dd id="c-record">–</dd>
          <dt>Clan</dt><dd id="c-clan">–</dd>
          <dt>Arena</dt><dd id="c-arena">–</dd>
        </dl>
        <p id="msg-clash" class="msg" role="status"></p>
      </div>
      <form id="form-tag" novalidate>
        <label>Tag de Supercell<input id="tag" placeholder="#2PP" autocapitalize="characters" autocomplete="off"></label>
        <p id="msg-tag" class="msg" role="status"></p>
        <button class="primario" id="btn-tag">Vincular tag</button>
      </form>
    </div>

    <div class="panel">
      <h2>Créditos</h2>
      <p class="copas" id="p-creditos">0</p>
    </div>
  </section>

</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-functions-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBOytBkkPwF5Rw_du0iOCIhnFtot0jUUuE",
  authDomain: "clash-royale-9e27b.firebaseapp.com",
  databaseURL: "https://clash-royale-9e27b-default-rtdb.firebaseio.com",
  projectId: "clash-royale-9e27b",
  appId: "1:792347939788:web:9b92040c8975f4bb098369"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
const functions = firebase.functions();

const $ = (id) => document.getElementById(id);
let modo = "crear";
let tagCargado = null;
let detener = [];

function mostrar(vista) {
  $("vista-auth").classList.toggle("oculto", vista !== "auth");
  $("vista-perfil").classList.toggle("oculto", vista !== "perfil");
}

function mensaje(id, texto, ok) {
  const el = $(id);
  el.textContent = texto || "";
  el.classList.toggle("ok", Boolean(ok));
}

function errorAuth(e) {
  const mapa = {
    "auth/email-already-in-use": "Ese correo ya tiene una cuenta. Entra con tu contraseña",
    "auth/invalid-email": "El correo no es válido",
    "auth/weak-password": "La contraseña debe tener mínimo 6 caracteres",
    "auth/invalid-credential": "Correo o contraseña incorrectos",
    "auth/wrong-password": "Correo o contraseña incorrectos",
    "auth/user-not-found": "Correo o contraseña incorrectos",
    "auth/too-many-requests": "Demasiados intentos. Espera un momento y prueba de nuevo"
  };
  return mapa[e.code] || "No pudimos completar la acción. Intenta de nuevo";
}

function cambiarModo(nuevo) {
  modo = nuevo;
  $("tab-crear").classList.toggle("activa", nuevo === "crear");
  $("tab-entrar").classList.toggle("activa", nuevo === "entrar");
  document.querySelectorAll(".solo-crear").forEach((el) => el.classList.toggle("oculto", nuevo !== "crear"));
  $("btn-auth").textContent = nuevo === "crear" ? "Crear cuenta" : "Entrar";
  $("clave").autocomplete = nuevo === "crear" ? "new-password" : "current-password";
  mensaje("msg-auth", "");
}
$("tab-crear").onclick = () => cambiarModo("crear");
$("tab-entrar").onclick = () => cambiarModo("entrar");

$("form-auth").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  mensaje("msg-auth", "");
  const correo = $("correo").value.trim().toLowerCase();
  const clave = $("clave").value;
  if (!correo || !clave) return mensaje("msg-auth", "Escribe tu correo y tu contraseña");

  $("btn-auth").disabled = true;
  try {
    if (modo === "entrar") {
      await auth.signInWithEmailAndPassword(correo, clave);
    } else {
      const nombre = $("nombre").value.trim();
      const telefono = $("telefono").value.replace(/[\s-]/g, "");
      if (nombre.length < 2) return mensaje("msg-auth", "Escribe tu nombre");
      if (!/^\+?[0-9]{7,15}$/.test(telefono)) return mensaje("msg-auth", "Escribe un teléfono válido, solo números");
      if (clave.length < 6) return mensaje("msg-auth", "La contraseña debe tener mínimo 6 caracteres");
      const cred = await auth.createUserWithEmailAndPassword(correo, clave);
      await db.ref("users/" + cred.user.uid).set({
        nombre, correo, telefono,
        creadoEn: firebase.database.ServerValue.TIMESTAMP
      });
    }
  } catch (e) {
    mensaje("msg-auth", errorAuth(e));
  } finally {
    $("btn-auth").disabled = false;
  }
});

$("btn-salir").onclick = () => auth.signOut();

async function traerClash(tag) {
  try {
    const r = await functions.httpsCallable("consultarJugador")({ tag });
    return r.data;
  } catch (e) {
    const propio = e.code && e.code.startsWith("functions/") &&
      !["functions/internal", "functions/unknown"].includes(e.code);
    throw new Error(propio ? e.message : "No pudimos consultar Clash Royale. Intenta de nuevo");
  }
}

async function cargarClash(tag) {
  mensaje("msg-clash", "");
  try {
    const d = await traerClash(tag);
    $("c-copas").textContent = d.copas;
    $("c-nombre").textContent = d.nombre + " (" + d.tag + ")";
    $("c-mejor").textContent = d.mejoresCopas;
    $("c-nivel").textContent = d.nivel;
    $("c-record").textContent = d.victorias + " / " + d.derrotas;
    $("c-clan").textContent = d.clan || "Sin clan";
    $("c-arena").textContent = d.arena || "–";
  } catch (e) {
    mensaje("msg-clash", e.message);
  }
}

$("form-tag").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  mensaje("msg-tag", "");
  const tag = "#" + $("tag").value.trim().toUpperCase().replace(/^#/, "");
  $("btn-tag").disabled = true;
  try {
    const d = await traerClash(tag);
    await db.ref("users/" + auth.currentUser.uid + "/tag").set(d.tag);
  } catch (e) {
    mensaje("msg-tag", e.message);
  } finally {
    $("btn-tag").disabled = false;
  }
});

function pintarPerfil(p, user) {
  $("p-nombre").textContent = p.nombre || "Mi perfil";
  $("p-correo").textContent = p.correo || user.email;
  $("p-telefono").textContent = p.telefono || "–";
  const hayTag = Boolean(p.tag);
  $("clash-vinculado").classList.toggle("oculto", !hayTag);
  $("form-tag").classList.toggle("oculto", hayTag);
  if (hayTag && p.tag !== tagCargado) {
    tagCargado = p.tag;
    cargarClash(p.tag);
  }
}

auth.onAuthStateChanged((user) => {
  detener.forEach((f) => f());
  detener = [];
  tagCargado = null;
  if (!user) return mostrar("auth");
  mostrar("perfil");
  const refPerfil = db.ref("users/" + user.uid);
  const refCred = db.ref("wallets/" + user.uid + "/creditos");
  const a = refPerfil.on("value", (s) => pintarPerfil(s.val() || {}, user));
  const b = refCred.on("value", (s) => { $("p-creditos").textContent = s.val() || 0; });
  detener.push(() => refPerfil.off("value", a), () => refCred.off("value", b));
});
</script>
</body>
</html>

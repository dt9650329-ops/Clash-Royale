name: Deploy Hosting
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - firebase.json
      - .github/workflows/hosting.yml
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        env:
          RAW_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          export FIREBASE_TOKEN="$(python3 -c "import os,re;t=os.environ['RAW_TOKEN'];t=re.sub('[\u2010-\u2015\u2212]','-',t);print(re.sub(r'\s','',t),end='')")"
          python3 -c "import os;print('caracteres raros restantes:',sum(1 for c in os.environ['FIREBASE_TOKEN'] if ord(c)>127))"
          npx -y firebase-tools deploy --only hosting --project clash-royale-9e27b

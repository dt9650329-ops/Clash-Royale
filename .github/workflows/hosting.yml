name: Deploy Hosting
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - firebase.json
      - .github/workflows/hosting.yml
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        env:
          RAW_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          export FIREBASE_TOKEN="$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]' | sed 's/\xe2\x80[\x90-\x95]/-/g')"
          npx -y firebase-tools deploy --only hosting --project clash-royale-9e27b

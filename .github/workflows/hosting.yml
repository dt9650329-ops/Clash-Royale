name: Deploy Hosting
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - firebase.json
      - .github/workflows/hosting.yml
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npx -y firebase-tools deploy --only hosting --project clash-royale-9e27b --debug
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
